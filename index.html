<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Josele – the daily word ladder</title>
  <meta name="description" content="Change one letter at a time to turn today's word into JOSE.">
  <meta name="theme-color" content="#0f1220">
  <link rel="canonical" href="https://josele.io/">
  <meta property="og:url" content="https://josele.io/">
  <meta property="og:title" content="Josele">
  <meta property="og:description" content="Change one letter at a time to turn today's word into JOSE.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😎</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="app" id="app">
    <header class="header">
      <button type="button" class="account-btn" id="account-btn" data-open="account">Log in</button>
      <h1><span class="logo" aria-hidden="true">😎</span> Josele</h1>
      <p class="subtitle" id="subtitle">&nbsp;</p>
      <p class="goal">Reach <b>JOSE</b> · steps: <span id="step-count">0</span></p>
    </header>

    <section class="board-wrap" id="board-wrap" aria-label="Your word ladder">
      <div class="board" id="board"></div>
    </section>

    <section class="keyboard" id="keyboard" aria-label="Keyboard"></section>

    <footer class="footer">
      <button type="button" class="link" data-open="yesterday">Yesterday's answer</button>
      <button type="button" class="link" data-open="leaderboard">Leaderboard</button>
      <button type="button" class="link" data-open="stats">Show stats</button>
      <button type="button" class="link" data-open="help">How to play</button>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="rain" id="rain" aria-hidden="true"></div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">×</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="js/words.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/names.js"></script>
  <script src="js/config.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/online.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
